name: Gebeta CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gebeta-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Web checks when the web app exists
        working-directory: apps/web
        run: |
          if [ ! -f package.json ]; then
            echo "apps/web has no package.json yet. Skipping web checks."
            exit 0
          fi
          npm ci
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Backend checks when the API exists
        working-directory: backend
        run: |
          if [ ! -f package.json ]; then
            echo "backend has no package.json yet. Skipping backend checks."
            exit 0
          fi
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test
